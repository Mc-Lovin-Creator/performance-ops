<style>
/* Layout: left rail + working canvas; one dominant answer per screen, hairline rows over cards (PadelOps rules, rebuilt) */
/* PadelOps house theme (themepdlops) for Performance Lab OS, adopted Oct 2026; layout from the Signal pass.
   Light = the clinic (clinical white void, whisper type, blue only as hairline and link).
   Dark  = the court console (one flat night floor, rails not shadows, colour only as status).
   One inverted signature card per view; one serif figure per screen; mono uppercase labels. */
:root{
  --bg:#F5F4F1; --surface:#FAFAF8; --surface-2:#F0EFEB; --sunk:#ECEBE6; --line:#E2E0DA; --line-2:rgba(28,27,31,0.08);
  --ink:#1C1B1F; --ink-2:#6E6B66; --ink-3:#A39E97; --inv:#FAFAF8;
  --accent:#5B5B6E; --accent-ink:#3A3A45; --accent-soft:#E8E6E0;
  --atmos-1:#DCEEE6; --atmos-2:#E7E0F2;
  --ok:#15803D; --ok-soft:#E3F1E7; --warn:#B45309; --warn-soft:#F7ECDA; --risk:#B91C1C; --risk-soft:#F7E2DF;
  --health:#4B4FC4; --health-soft:#E7E7F7; --load:#5B5B6E; --load-soft:#E8E6E0; --muted-soft:#ECEBE6;
  --band-high:#B08A3E; --band-mod:#5B7D99; --band-low:#A39E97; --band-vhigh:#B91C1C;
  --sig-bg:#1C1B1F; --sig-ink:#FAFAF8; --sig-mute:#A39E97;
  --topo-bg:#F5F4F1; --topo-fg:#B9B4AC;
  --shadow:0 1px 2px rgba(28,27,31,.04),0 8px 24px rgba(28,27,31,.05);
  --f-ui:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif; --f-display:Georgia,"Times New Roman",serif; --f-mono:"Manrope",system-ui,sans-serif;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:20px; --r-xxl:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131113; --surface:#1C191C; --surface-2:#252126; --sunk:#2E282E; --line:#463D44; --line-2:rgba(255,255,255,0.08);
  --ink:#F7F5F1; --ink-2:#A39E97; --ink-3:#7A7570; --inv:#131113;
  --accent:#A8AAB5; --accent-ink:#DEDAD2; --accent-soft:#2E282E;
  --atmos-1:#123C35; --atmos-2:#30213D;
  --ok:#10B981; --ok-soft:#14261F; --warn:#F59E0B; --warn-soft:#2C2214; --risk:#EF4444; --risk-soft:#2E1716;
  --health:#9EA3FF; --health-soft:#23233A; --load:#A8AAB5; --load-soft:#2E282E; --muted-soft:#2E282E;
  --band-high:#D4AE62; --band-mod:#7FA2C0; --band-low:#7A7570; --band-vhigh:#EF4444;
  --sig-bg:#F7F5F1; --sig-ink:#131113; --sig-mute:#6E6B66;
  --topo-bg:#131113; --topo-fg:#6E6770;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131113; --surface:#1C191C; --surface-2:#252126; --sunk:#2E282E; --line:#463D44; --line-2:rgba(255,255,255,0.08);
  --ink:#F7F5F1; --ink-2:#A39E97; --ink-3:#7A7570; --inv:#131113;
  --accent:#A8AAB5; --accent-ink:#DEDAD2; --accent-soft:#2E282E;
  --atmos-1:#123C35; --atmos-2:#30213D;
  --ok:#10B981; --ok-soft:#14261F; --warn:#F59E0B; --warn-soft:#2C2214; --risk:#EF4444; --risk-soft:#2E1716;
  --health:#9EA3FF; --health-soft:#23233A; --load:#A8AAB5; --load-soft:#2E282E; --muted-soft:#2E282E;
  --band-high:#D4AE62; --band-mod:#7FA2C0; --band-low:#7A7570; --band-vhigh:#EF4444;
  --sig-bg:#F7F5F1; --sig-ink:#131113; --sig-mute:#6E6B66;
  --topo-bg:#131113; --topo-fg:#6E6770;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.muted{color:var(--ink-2)}
.serif{font-family:var(--f-display);font-weight:400}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:20px;font-weight:800;letter-spacing:-.2px}
h3{font-size:15px;font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* app frame */
.app{display:flex;min-height:100%}
.rail{width:244px;flex:none;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--bg);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:800;font-size:15px;letter-spacing:.1px}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--inv);display:grid;place-items:center}
.nav-label{padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px}
.nav a svg{flex:none;opacity:.85}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--inv)}
.nav a .count{margin-left:auto;font-size:11px;font-weight:800;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.nav a[aria-current="page"] .count{background:rgba(255,255,255,.16);color:var(--inv)}
.rail-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.search{flex:1 1 280px;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px 0 14px;border:1px solid var(--line);background:var(--surface);border-radius:12px;color:var(--ink-2);text-align:left;font-size:14px}
.search kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink-2)}
.priv{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px}
.priv[data-on="true"]{background:var(--health-soft);border-color:transparent;color:var(--health)}
.switch{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;border:0;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.23,1,.32,1)}
.switch[aria-checked="true"]{background:var(--health)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.who{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 12px 0 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:13px}
.who select{border:0;background:transparent;font-weight:700;padding-right:4px;max-width:190px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--sunk);color:var(--ink);flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.page{padding:28px max(24px,env(safe-area-inset-right,0px)) 80px 28px;display:flex;flex-direction:column;gap:28px;max-width:1500px;width:100%}
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--health-soft);color:var(--health);font-weight:700;font-size:13px}

/* atmos hero */
.hero{position:relative;border-radius:var(--r-xxl);padding:28px 30px;background:radial-gradient(120% 140% at 0% 0%,var(--atmos-1),var(--atmos-2) 60%,var(--bg));display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:space-between;overflow:hidden}
.hero .big{font-family:var(--f-display);font-size:clamp(64px,8vw,104px);line-height:.86;letter-spacing:-3px}
.hero-sub{font-size:20px;line-height:1.35;max-width:420px}
.seg{display:inline-flex;gap:3px;padding:4px;border-radius:999px;background:var(--sunk)}
.seg button{border:0;background:transparent;min-height:36px;padding:0 16px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--inv)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{font-size:28px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-2);font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ink-panel{background:var(--ink);color:var(--inv);border-radius:var(--r-xl);padding:22px;display:flex;flex-direction:column;gap:12px}
.ink-panel .muted{color:color-mix(in srgb,var(--inv) 70%,transparent)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line-2);min-height:52px}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row-btn{width:100%;border:0;background:transparent;text-align:left;padding:12px 10px;margin:0 -10px;width:calc(100% + 20px);border-radius:12px}
.row-btn:hover{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-risk{background:var(--risk-soft);color:var(--risk)}
.c-health{background:var(--health-soft);color:var(--health)} .c-load{background:var(--load-soft);color:var(--load)} .c-muted{background:var(--muted-soft);color:var(--ink-2)}
.c-accent{background:var(--accent-soft);color:var(--accent-ink)}
.table-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-2);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--inv);border-color:var(--accent)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.field input,.field select,.field textarea{font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:42px;padding:8px 12px;font-size:14px}
.field textarea{min-height:84px;resize:vertical}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);min-height:34px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--inv);border-color:var(--ink)}
.locked{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);color:var(--ink-2);font-size:13px;background:repeating-linear-gradient(-45deg,transparent 0 8px,var(--surface-2) 8px 9px)}
.blur{filter:blur(5px);user-select:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--inv);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:90;transition:all .3s cubic-bezier(.23,1,.32,1);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-2);font-family:var(--f-ui);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar-track{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar-fill{height:100%;border-radius:999px}

/* anatomy */
.lab{display:grid;grid-template-columns:256px minmax(0,1fr) 320px;gap:0;border:1px solid var(--line);border-radius:var(--r-xxl);overflow:hidden;background:var(--surface);min-height:760px}
.lab-side{padding:18px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;max-height:820px}
.lab-side.left{border-right:1px solid var(--line)}
.lab-side.right{border-left:1px solid var(--line)}
.lab-stage{position:relative;min-height:800px;background:radial-gradient(90% 70% at 50% 40%,var(--surface) 0%,var(--surface-2) 70%,var(--sunk) 100%)}
.lab-canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
.stage-top{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:2}
.views{display:flex;flex-direction:column;gap:4px;padding:6px}
.views .pill{min-height:30px;font-size:12px;padding:0 10px;text-align:left}
.stage-top>*{pointer-events:auto}
.stage-bot{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.glass{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:8px}
.angles{display:grid;grid-template-columns:repeat(3,auto);gap:2px 14px;font-size:11px;padding:10px 12px}
.angles b{font-size:16px;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:var(--inv);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;transform:translate(12px,12px)}
.alarm{background:var(--risk);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;font-size:13px;max-width:360px}
.range{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2)}
.range input{width:100%;accent-color:var(--accent)}
.layer{display:flex;align-items:center;gap:10px;min-height:38px;font-weight:700;font-size:13px}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.facts{display:flex;flex-direction:column}
.facts>div{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:13px}
.facts>div>span:first-child{color:var(--ink-2);font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding-top:2px}

/* messages */
.msg-shell{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;border:1px solid var(--line);border-radius:var(--r-xxl);overflow:hidden;background:var(--surface);min-height:680px}
.msg-list{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:4px}
.msg-ctx{border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px}
.thread{display:flex;flex-direction:column;min-width:0}
.thread-body{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;max-height:560px}
.bubble{display:flex;gap:12px;align-items:flex-start}
.composer{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px}
.ch{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 10px;border:0;border-radius:12px;background:transparent;text-align:left}
.ch:hover{background:var(--surface-2)} .ch[aria-current="true"]{background:var(--sunk)}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(168px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r-l);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}

/* palette */
.palette{position:fixed;inset:0;z-index:85;background:rgba(18,18,17,.45);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palette-box{width:min(720px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.palette-box input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;min-height:60px;padding:0 20px;font-size:18px;outline:none}
.palette-res{max-height:56vh;overflow-y:auto;padding:8px}
.res{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px}
.res:hover,.res[aria-selected="true"]{background:var(--surface-2)}


/* ---- SIGNAL layer ---- */
body{font-size:15px;letter-spacing:-0.005em}
h1{font-weight:400!important;letter-spacing:-0.035em!important}
h2{font-weight:500;letter-spacing:-0.02em}
h3{font-weight:500;letter-spacing:-0.01em}
.eyebrow,th,.legend,.nav-label,.kpi .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;text-transform:uppercase;font-weight:400;color:var(--ink-2)}
.brand{font-weight:500;letter-spacing:-0.02em}
.brand-mark{border-radius:6px}
.rail{background:var(--bg)}
.nav a{border-radius:8px;font-weight:500;min-height:38px}
.nav a[aria-current="page"]{background:var(--sig-bg);color:var(--sig-ink)}
.nav a .count{font-family:var(--f-mono);font-weight:500;background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.nav a[aria-current="page"] .count{border-color:transparent;background:rgba(127,127,127,.18);color:inherit}
.top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.search,.priv,.who,.icon-btn{background:var(--surface);border-color:var(--line)}
.search kbd{font-size:10.5px}
.priv[data-on="true"]{background:var(--sig-bg);color:var(--sig-ink)}
